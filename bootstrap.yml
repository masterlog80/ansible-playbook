---
# =============================================================================
# bootstrap.yml – Initial root SSH bootstrap
# =============================================================================
# Purpose:
#   1. Connect to a fresh node as root using its initial password.
#   2. Install the public SSH key published by admin_github_user.
#   3. Disable root password authentication for SSH.
#
# The password is NOT defined here. Semaphore (or Ansible --ask-pass) supplies
# ansible_password at runtime.
#
# Run once per fresh node:
#   ansible-playbook -i inventory/hosts.ini bootstrap.yml --ask-pass
#
# After this playbook completes, use the matching private SSH key for site.yml.
# =============================================================================

- name: Bootstrap root SSH access
  hosts: all
  become: true

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted

  tasks:
    - name: Install SSH public key from GitHub for root
      ansible.posix.authorized_key:
        user: root
        key: "https://github.com/{{ admin_github_user }}.keys"
        state: present
      tags: [bootstrap, ssh]

    - name: Allow root SSH login only with public key
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: "PermitRootLogin prohibit-password"
        state: present
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart sshd
      tags: [bootstrap, ssh]
