---
# =============================================================================
# site.yml – System bootstrap playbook
# =============================================================================
# Structure: ONE playbook, THREE plays.
#
#   1. "System bootstrap (common baseline)" — hosts: all
#      Runs on every managed node regardless of role: updates, packages,
#      swap, timezone, NTP, DNS, udev rules (GSM modem, UPS OMRON, UPS APC),
#      sysstat, users, SSH
#      hardening, zsh, autologin, static IP, hostname.
#
#   2. "K3S role" — hosts: k3s_nodes
#      Only runs on hosts in the [k3s_nodes] inventory group.
#
#   3. "Docker role" — hosts: docker_nodes
#      Only runs on hosts in the [docker_nodes] inventory group.
#
# A host's ROLE (what gets installed beyond the common baseline) is decided
# entirely by inventory group membership (inventory/hosts.ini) — not by
# writing a separate playbook per device. To add a new role (e.g. "monitoring"),
# add a new play here gated on a new group, the same way k3s/docker are done.
#
# Run everything:            ansible-playbook site.yml
# Only the baseline:         ansible-playbook site.yml --tags baseline
# Only K3S nodes:             ansible-playbook site.yml --tags k3s
# Only Docker nodes:          ansible-playbook site.yml --tags docker
# Just one host:               ansible-playbook site.yml --limit node1
# =============================================================================

# =============================================================================
# PLAY 1 — Common baseline (all hosts)
# =============================================================================
- name: System bootstrap (common baseline)
  hosts: all
  become: true

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart chrony
      ansible.builtin.service:
        name: chrony
        state: restarted

    - name: Restart systemd-timesyncd
      ansible.builtin.service:
        name: systemd-timesyncd
        state: restarted

    - name: Restart systemd-resolved
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted

    - name: Apply netplan
      ansible.builtin.command: netplan apply
      changed_when: true

    - name: Reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: true

    - name: Trigger udev
      ansible.builtin.command: udevadm trigger
      changed_when: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. System Update
    # -------------------------------------------------------------------------
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [baseline, update]

    - name: Dist-upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      tags: [baseline, update]

    # -------------------------------------------------------------------------
    # 2. Package Installation
    # -------------------------------------------------------------------------
    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
      tags: [baseline, packages]

    # -------------------------------------------------------------------------
    # 3. Disable swap
    # -------------------------------------------------------------------------
    - name: Disable all swap immediately
      ansible.builtin.command: swapoff -a
      register: swapoff_result
      changed_when: swapoff_result.rc == 0
      tags: [baseline, swap]

    - name: Remove swap entries from /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#\n].*?\sswap\s+\S+\s+.*)$'
        replace: '# \1'
      tags: [baseline, swap]

    - name: Disable systemd swap units
      ansible.builtin.shell: |
        units=$(systemctl --type swap --all --no-legend | awk '{print $1}')
        if [ -n "$units" ]; then
          echo "$units" | xargs systemctl mask --now
          echo "changed"
        fi
      register: swap_units_result
      changed_when: "'changed' in swap_units_result.stdout"
      tags: [baseline, swap]

    # -------------------------------------------------------------------------
    # 4. Timezone
    # -------------------------------------------------------------------------
    - name: Set timezone to {{ timezone }}
      community.general.timezone:
        name: "{{ timezone }}"
      tags: [baseline, timezone]

    # -------------------------------------------------------------------------
    # 5. NTP
    # -------------------------------------------------------------------------
    # Detect the NTP implementation before installing/configuring either one.
    # With ntp_client=auto, an already-active implementation is preserved.
    # If neither is active, Chrony is selected as the default.
    - name: Gather service facts for NTP detection
      ansible.builtin.service_facts:
      tags: [baseline, ntp]

    - name: Select NTP client automatically
      ansible.builtin.set_fact:
        selected_ntp_client: >-
          {{ 'chrony' if ansible_facts.services.get('chrony.service', {}).get('state') == 'running'
             else 'systemd-timesyncd' if ansible_facts.services.get('systemd-timesyncd.service', {}).get('state') == 'running'
             else 'chrony' }}
      when: ntp_client == 'auto'
      tags: [baseline, ntp]

    - name: Select configured NTP client
      ansible.builtin.set_fact:
        selected_ntp_client: "{{ ntp_client }}"
      when: ntp_client != 'auto'
      tags: [baseline, ntp]

    - name: Validate selected NTP client
      ansible.builtin.assert:
        that:
          - selected_ntp_client in ['chrony', 'systemd-timesyncd']
        fail_msg: "ntp_client must be 'auto', 'chrony', or 'systemd-timesyncd'."
      tags: [baseline, ntp]

    - name: Install Chrony when selected
      ansible.builtin.apt:
        name: chrony
        state: present
      when: selected_ntp_client == 'chrony'
      tags: [baseline, ntp]

    - name: Install systemd-timesyncd when selected
      ansible.builtin.apt:
        name: systemd-timesyncd
        state: present
      when: selected_ntp_client == 'systemd-timesyncd'
      tags: [baseline, ntp]

    - name: Deploy Chrony configuration
      ansible.builtin.template:
        src: templates/chrony.conf.j2
        dest: /etc/chrony/chrony.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart chrony
      when: selected_ntp_client == 'chrony'
      tags: [baseline, ntp]

    - name: Ensure Chrony is running and enabled
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true
      when: selected_ntp_client == 'chrony'
      tags: [baseline, ntp]

    - name: Deploy systemd-timesyncd configuration
      ansible.builtin.template:
        src: templates/systemd-timesyncd.conf.j2
        dest: /etc/systemd/timesyncd.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart systemd-timesyncd
      when: selected_ntp_client == 'systemd-timesyncd'
      tags: [baseline, ntp]

    - name: Ensure systemd-timesyncd is running and enabled
      ansible.builtin.service:
        name: systemd-timesyncd
        state: started
        enabled: true
      when: selected_ntp_client == 'systemd-timesyncd'
      tags: [baseline, ntp]

    - name: Disable systemd-timesyncd when Chrony is selected
      ansible.builtin.service:
        name: systemd-timesyncd
        state: stopped
        enabled: false
      when:
        - selected_ntp_client == 'chrony'
        - ansible_facts.services.get('systemd-timesyncd.service', {}).get('state') in ['running', 'stopped']
      tags: [baseline, ntp]

    - name: Disable Chrony when systemd-timesyncd is selected
      ansible.builtin.service:
        name: chrony
        state: stopped
        enabled: false
      when:
        - selected_ntp_client == 'systemd-timesyncd'
        - ansible_facts.services.get('chrony.service', {}).get('state') in ['running', 'stopped']
      tags: [baseline, ntp]

    # -------------------------------------------------------------------------
    # 6. DNS & Domain via systemd-resolved
    # -------------------------------------------------------------------------
    - name: Deploy systemd-resolved configuration
      ansible.builtin.template:
        src: templates/resolved.conf.j2
        dest: /etc/systemd/resolved.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart systemd-resolved
      tags: [baseline, dns]

    - name: Ensure systemd-resolved is running and enabled
      ansible.builtin.service:
        name: systemd-resolved
        state: started
        enabled: true
      tags: [baseline, dns]

    # -------------------------------------------------------------------------
    # 7. udev rules (GSM modem, UPS OMRON, UPS APC)
    # -------------------------------------------------------------------------
    - name: Deploy GSM modem udev rule (Qualcomm)
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/90-qualcomm.rules
        content: |
          SUBSYSTEM=="usb", ATTR{idVendor}=="05c6", ATTR{idProduct}=="1000", RUN+="/usr/sbin/usb_modeswitch -W -v 05c6 -p 1000 -K"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload udev rules
        - Trigger udev
      tags: [baseline, udev, modem]

    - name: Deploy UPS OMRON udev rule
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/90-omron-ups.conf
        content: |
          SUBSYSTEM=="usb", ENV{DEVTYPE}=="usb_device", ATTRS{idVendor}=="0590", ATTRS{idProduct}=="0081", MODE="0664", GROUP="nut", SYMLINK+="ups"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload udev rules
        - Trigger udev
      tags: [baseline, udev, ups]

    - name: Deploy UPS APC udev rule
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-ups.rules
        content: |
          SUBSYSTEM=="usb", ATTR{idVendor}=="051d", ATTR{idProduct}=="0002", SYMLINK+="ups-network"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload udev rules
        - Trigger udev
      tags: [baseline, udev, ups]

    # -------------------------------------------------------------------------
    # 8. Disable sysstat
    # -------------------------------------------------------------------------
    - name: Stop and disable sysstat service
      ansible.builtin.service:
        name: sysstat
        state: stopped
        enabled: false
      ignore_errors: true   # service may not be present on all systems
      tags: [baseline, sysstat]

    # -------------------------------------------------------------------------
    # 9. User management
    # -------------------------------------------------------------------------

    # Create the admin user first so that there is always an active admin
    # account even while the playbook is running.
    - name: Create admin user {{ admin_user }}
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/zsh
        create_home: true
        state: present
      tags: [baseline, users]

    - name: Grant {{ admin_user }} passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s
      tags: [baseline, users]

    - name: Add SSH public key from GitHub for {{ admin_user }}
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "https://github.com/{{ admin_github_user }}.keys"
        state: present
      tags: [baseline, users]

    - name: Set root's shell to zsh
      ansible.builtin.user:
        name: root
        shell: /bin/zsh
      tags: [baseline, users, zsh]

    # Collect users to delete AFTER the admin user is ready.
    - name: Gather list of non-root / non-admin regular users
      ansible.builtin.shell: |
        getent passwd | awk -F: -v admin="{{ admin_user }}" \
          '$3 >= 1000 && $1 != "nobody" && $1 != admin {print $1}'
      register: users_to_delete
      changed_when: false
      tags: [baseline, users]

    - name: Gracefully stop processes for users that will be deleted
      ansible.builtin.shell: |
        pkill -TERM -u "{{ item }}" || true
      loop: "{{ users_to_delete.stdout_lines }}"
      when: users_to_delete.stdout_lines | length > 0
      ignore_errors: true
      tags: [baseline, users]

    - name: Wait briefly for processes to exit
      ansible.builtin.pause:
        seconds: 3
      when: users_to_delete.stdout_lines | length > 0
      tags: [baseline, users]

    - name: Force-kill remaining processes for users that will be deleted
      ansible.builtin.shell: |
        pkill -KILL -u "{{ item }}" || true
      loop: "{{ users_to_delete.stdout_lines }}"
      when: users_to_delete.stdout_lines | length > 0
      ignore_errors: true
      tags: [baseline, users]

    - name: Remove non-admin regular users and their home directories
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
        remove: true
        force: true
      loop: "{{ users_to_delete.stdout_lines }}"
      when: users_to_delete.stdout_lines | length > 0
      tags: [baseline, users]

    # -------------------------------------------------------------------------
    # 10. Disable root SSH login while preserving the root password
    # -------------------------------------------------------------------------
    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: "PermitRootLogin no"
        state: present
      notify: Restart sshd
      tags: [baseline, ssh]

    # -------------------------------------------------------------------------
    # 11. ZSH – Oh My Zsh, Powerlevel10k, plugins (for every user in zsh_users)
    # -------------------------------------------------------------------------
    - name: Check if Oh My Zsh is already installed
      ansible.builtin.stat:
        path: "{{ item.home }}/.oh-my-zsh"
      register: omzsh_stat
      loop: "{{ zsh_users }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [baseline, zsh]

    - name: Install Oh My Zsh
      # Security note: the installer is fetched from the official ohmyzsh repo.
      # RUNZSH=no and CHSH=no prevent the script from switching the shell
      # interactively; the shell is already set via the user module above.
      ansible.builtin.shell: |
        RUNZSH=no CHSH=no \
        sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
      become_user: "{{ item.item.name }}"
      environment:
        HOME: "{{ item.item.home }}"
      args:
        creates: "{{ item.item.home }}/.oh-my-zsh"
      loop: "{{ omzsh_stat.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not item.stat.exists
      tags: [baseline, zsh]

    - name: Clone Powerlevel10k theme
      ansible.builtin.git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ item.home }}/.oh-my-zsh/custom/themes/powerlevel10k"
        depth: 1
        update: false
      become_user: "{{ item.name }}"
      loop: "{{ zsh_users }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [baseline, zsh]

    - name: Clone external zsh plugins (zsh-syntax-highlighting, zsh-autosuggestions)
      ansible.builtin.git:
        repo: "{{ item.1.repo }}"
        dest: "{{ item.0.home }}/.oh-my-zsh/custom/plugins/{{ item.1.name }}"
        depth: 1
        update: false
      become_user: "{{ item.0.name }}"
      with_nested:
        - "{{ zsh_users }}"
        - "{{ zsh_external_plugins }}"
      loop_control:
        label: "{{ item.0.name }} / {{ item.1.name }}"
      tags: [baseline, zsh]

    - name: Deploy .zshrc
      ansible.builtin.template:
        src: templates/zshrc.j2
        dest: "{{ item.home }}/.zshrc"
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: "0644"
      loop: "{{ zsh_users }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [baseline, zsh]

    # -------------------------------------------------------------------------
    # 12. Getty autologin for {{ admin_user }}
    # -------------------------------------------------------------------------
    - name: Ensure getty override directory exists (/lib)
      ansible.builtin.file:
        path: /lib/systemd/system/getty@.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [baseline, autologin]

    - name: Ensure getty override directory exists (/etc)
      ansible.builtin.file:
        path: /etc/systemd/system/getty@.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [baseline, autologin]

    - name: Configure getty autologin for {{ admin_user }} (/lib)
      ansible.builtin.copy:
        dest: /lib/systemd/system/getty@.service.d/override.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin {{ admin_user }} --noclear %I $TERM
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd
      tags: [baseline, autologin]

    - name: Configure getty autologin for {{ admin_user }} (/etc – canonical)
      ansible.builtin.copy:
        dest: /etc/systemd/system/getty@.service.d/override.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin {{ admin_user }} --noclear %I $TERM
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd
      tags: [baseline, autologin]

    # -------------------------------------------------------------------------
    # 13. Static IP via Netplan
    # -------------------------------------------------------------------------
    - name: Deploy Netplan static-IP configuration
      ansible.builtin.template:
        src: templates/netplan.yml.j2
        dest: /etc/netplan/01-ansible-static.yaml
        owner: root
        group: root
        mode: "0600"
      notify: Apply netplan
      tags: [baseline, network]

    # -------------------------------------------------------------------------
    # 14. Hostname
    # -------------------------------------------------------------------------
    - name: Set hostname to {{ hostname }}
      ansible.builtin.hostname:
        name: "{{ hostname }}"
      tags: [baseline, hostname]

    - name: Ensure hostname is in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+'
        line: "127.0.1.1 {{ hostname }}"
        state: present
      tags: [baseline, hostname]

# =============================================================================
# PLAY 2 — K3S role (hosts in [k3s_nodes])
# =============================================================================
- name: K3S role
  hosts: k3s_nodes
  become: true
  tags: [k3s]

  tasks:
    # Security note: the K3S installer is fetched directly from
    # https://get.k3s.io. When pinning a specific version via k3s_version,
    # you can additionally verify the binary checksum from the official
    # release page at https://github.com/k3s-io/k3s/releases
    - name: Download K3S install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"
      tags: [k3s]

    - name: Run K3S install script
      ansible.builtin.shell: /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "{{ k3s_install_flags }}"
      args:
        creates: /usr/local/bin/k3s
      tags: [k3s]

# =============================================================================
# PLAY 3 — Docker role (hosts in [docker_nodes])
# =============================================================================
- name: Docker role
  hosts: docker_nodes
  become: true
  tags: [docker]

  tasks:
    # ca-certificates and curl are installed for every host via the
    # baseline "packages" list in group_vars/all.yml — no need to
    # re-install them here.
    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [docker]

    # Security note: Docker's official GPG key, fetched over HTTPS from
    # download.docker.com and used to verify the apt repo below.
    - name: Download Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      tags: [docker]

    - name: Determine dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false
      tags: [docker]

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} {{ docker_channel }}
        filename: docker
        state: present
      tags: [docker]

    - name: Install Docker Engine + Compose plugin
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true
      tags: [docker]

    - name: Ensure Docker service is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      tags: [docker]

    - name: Add users to the docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_group_members }}"
      tags: [docker]

# =============================================================================
# PLAY 4 — role_1 (hosts in [role_1])
# =============================================================================
# Placeholder role added to demonstrate/exercise the pattern described in
# README.md ("Adding a new role"). Replace the placeholder task below with
# whatever this role should actually do, and rename the group/tag/file trio
# (inventory group, group_vars/role_1.yml, this play) to something
# meaningful once its real purpose is known.
- name: role_1
  hosts: role_1
  become: true
  tags: [role_1]

  tasks:
    - name: role_1 placeholder task
      ansible.builtin.debug:
        msg: "role_1 applied to {{ inventory_hostname }} (node_role={{ node_role }})"
      tags: [role_1]

