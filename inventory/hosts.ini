# =============================================================================
# Ansible Inventory
# =============================================================================
# Add one entry per managed host. The hostname must match the corresponding
# file in host_vars/ (e.g. host_vars/node1.yml).
#
# Connection options can be overridden per host:
#   ansible_user=<ssh_user>  ansible_ssh_private_key_file=~/.ssh/id_rsa
# =============================================================================

[nodes]
node1  ansible_host=192.168.10.10  ansible_user=ubuntu
node2  ansible_host=192.168.10.11  ansible_user=ubuntu
node3  ansible_host=192.168.10.12  ansible_user=ubuntu

[nodes:vars]
ansible_python_interpreter=/usr/bin/python3
