# =============================================================================
# Ansible Inventory
# =============================================================================
# Add one entry per managed host. The hostname must match the corresponding
# file in host_vars/ (e.g. host_vars/node1.yml).
#
# Connection options can be overridden per host:
#   ansible_user=<ssh_user>  ansible_ssh_private_key_file=~/.ssh/id_rsa
#
# ROLE GROUPS
# -----------
# Every host must belong to [nodes] (the common baseline: updates, packages,
# users, networking, zsh, etc. — see site.yml) AND to exactly one (or more,
# if a device legitimately runs both) role group below, which decides what
# else gets installed:
#
#   [k3s_nodes]     -> reserved for K3S worker/agent nodes; agent installation
#                      and cluster joining are not automated by site.yml
#   [docker_nodes]  -> Docker Engine + Compose plugin is installed
#                      (site.yml, tagged "docker")
#   [k3s_master]    -> installs the K3S control plane (Traefik/ServiceLB/
#                      metrics-server disabled), taints the node NoSchedule,
#                      and installs FluxCD + Helm (site.yml, tag "k3s_master")
#   [role_1]        -> placeholder role (site.yml, tagged "role_1") — replace
#                      the placeholder task with real ones when ready
#   [role_2]        -> placeholder role (site.yml, tagged "role_2")
#   [role_3]        -> placeholder role (site.yml, tagged "role_3")
#   [nvme_present]  -> prepares /dev/nvme0n1 as ext4 and mounts /mnt/K3S
#
# A HOST CAN BELONG TO MULTIPLE ROLE GROUPS AT ONCE. Ansible applies every
# play whose "hosts:" pattern matches a given host, in the order the plays
# appear in site.yml — so a host in both [k3s_nodes] and [role_1] gets K3S
# installed AND role_1's tasks, in that order, in the same playbook run.
# See "Adding a host to a role" in README.md for worked examples.
#
# To onboard a new device: add it under [nodes], add it under the role
# group(s) that match what it should run, and add a host_vars/<name>.yml
# with at least its static_ip. No new playbook needed.
# =============================================================================

[nodes]
node4  ansible_host=192.168.10.244  ansible_user=lorenzo

[k3s_nodes]
node4

[docker_nodes]

# Only add hosts with a dedicated /dev/nvme0n1 disk to this group.
[nvme_present]
node4

# Placeholder role groups (see PLAY 5/6/7 in site.yml). Empty until you
# assign real hosts — add a hostname on its own line under the group(s)
# you want it to run, the same way node4 is assigned under [nodes] above.
[role_1]

[role_2]

[role_3]

# K3S control-plane node(s). K3S installation is performed only in this
# group, using control-plane flags (Traefik/ServiceLB/metrics-server
# disabled). The play also taints the node and installs FluxCD + Helm.
# Keep control-plane hosts separate from [k3s_nodes], which is reserved for
# worker/agent nodes; worker installation and cluster joining are not yet
# automated by this playbook.
[k3s_master]

[nodes:vars]
ansible_python_interpreter=/usr/bin/python3
