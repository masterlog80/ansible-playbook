---
# =============================================================================
# Variables shared by ALL hosts
# =============================================================================

# ---------------------------------------------------------------------------
# Package list
# ---------------------------------------------------------------------------
packages:
  - htop
  - btop
  - nvme-cli
  - ca-certificates
  - curl
  - iputils-ping
  - dnsutils
  - ssh-import-id
  - avahi-daemon
  - usb-modeswitch
  - usb-modeswitch-data
  - net-tools
  - vim
  - nmap
  - libusb-1.0-0-dev
  - iperf3
  - expect
  - zip
  - pv
  - unzip
  - html2text
  - build-essential
  - software-properties-common
  - openvswitch-switch
  - nano
  - avahi-utils
  - libnss-mdns
  - zsh
  - sudo
  - open-iscsi
  - gpg
  - apt-transport-https
  - cifs-utils
  - git
  - python3-pygments   # required by the colorize zsh plugin

# ---------------------------------------------------------------------------
# Timezone
# ---------------------------------------------------------------------------
timezone: Asia/Tokyo

# ---------------------------------------------------------------------------
# DNS & Domain
# ---------------------------------------------------------------------------
dns_servers:
  - 192.168.10.3
  - 192.168.10.4
  - 1.1.1.1

dns_search_domain: salvetti.info

# ---------------------------------------------------------------------------
# NTP
# ---------------------------------------------------------------------------
# NTP client implementation:
#   auto                Detect the currently active NTP implementation.
#   chrony              Force Chrony.
#   systemd-timesyncd   Force systemd-timesyncd.
ntp_client: auto

# Prefer the local NTP server. Ubuntu NTP is used as the fallback source.
ntp_primary: 192.168.10.8
ntp_fallback: ntp.ubuntu.com

# ---------------------------------------------------------------------------
# Admin user
# ---------------------------------------------------------------------------
admin_user: lorenzo
admin_github_user: masterlog80

# Extra literal SSH public keys installed for admin_user in addition to the
# GitHub-published ones. Optional; lets a run still succeed in adding a way in
# when github.com is unreachable. Override in the vault file / a Variable Group.
additional_authorized_keys: []

# NOTE: root_password_hash and admin_user_password_hash (required — see the
# assert at the top of the user-management section in site.yml) are
# deliberately NOT defined here: they are secrets and live in the encrypted
# group_vars/all/vault.yml. See group_vars/all/vault.yml.example.

# ---------------------------------------------------------------------------
# Zsh / Oh My Zsh
# ---------------------------------------------------------------------------
# Every user in this list gets: shell set to zsh, Oh My Zsh + Powerlevel10k
# + the plugin set below, deployed identically. Add an entry here (with its
# home directory) to extend zsh/Oh My Zsh to another user.
zsh_users:
  - name: "{{ admin_user }}"
    home: "/home/{{ admin_user }}"
  - name: root
    home: /root

# Oh My Zsh plugins enabled in .zshrc (templates/zshrc.j2). All of these are
# bundled with Oh My Zsh itself EXCEPT zsh-syntax-highlighting and
# zsh-autosuggestions, which are cloned separately from their upstream repos
# (see the "external zsh plugin" tasks in site.yml) because Oh My Zsh does
# not ship them.
zsh_plugins:
  - kubectl
  - kubectx
  - kube-ps1
  - git
  - zsh-syntax-highlighting
  - zsh-autosuggestions
  - docker
  - docker-compose
  - colorize
  - last-working-dir

# External (not bundled with Oh My Zsh) plugins to clone into
# <home>/.oh-my-zsh/custom/plugins/<name>. Must be a subset of zsh_plugins.
# Pinned to release tags for reproducible installs (and so an upstream change
# can't silently alter what gets installed on a fresh node). Existing clones
# are left alone (update: false); bump these deliberately to upgrade.
zsh_external_plugins:
  - name: zsh-syntax-highlighting
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    version: "0.8.0"
  - name: zsh-autosuggestions
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    version: "v0.7.1"

# Powerlevel10k theme release tag (same pinning rationale as above).
powerlevel10k_version: "v1.20.0"

# ---------------------------------------------------------------------------
# Node role
# ---------------------------------------------------------------------------
# Purely informational (also derivable from group membership) — surfaced so
# templates/tasks can reference "{{ node_role }}" if useful. Set per-group
# in group_vars/k3s_nodes.yml / group_vars/docker_nodes.yml.
node_role: baseline

# ---------------------------------------------------------------------------
# Network (defaults – override per host in host_vars/)
# ---------------------------------------------------------------------------
# Subnet prefix length (e.g. 24 for /24).
subnet_prefix: 24
# Default gateway.
gateway: 192.168.10.1
